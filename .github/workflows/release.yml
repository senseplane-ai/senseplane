#
# Builds and publishes the images to ghcr.io/senseplane-ai/<service>
# (api, mcp, media, console, brain, bridge) for linux/amd64 and linux/arm64,
# each architecture on its own native runner. docs/dev/releasing.md.
#
#   tag vX.Y.Z      the ci workflow first, then X.Y.Z, X.Y (the release line the
#                   compose file uses), the commit SHA, and latest when this is
#                   the newest stable release; then a GitHub Release with the
#                   tag's notes and docker-compose.yml attached
#   main            after ci passed on the push: edge and the commit SHA
#   manual          any branch, tag or commit: the ci workflow, then its commit SHA
#
# Images carry OCI labels, SBOM and provenance attestations, and a keyless
# cosign signature (Sigstore, tied to this workflow).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build and push (tagged with its commit SHA)
        required: true
        default: main

permissions: {}

concurrency:
  # A newer main supersedes an unfinished edge build; releases never cancel.
  group: release-${{ github.event_name == 'workflow_run' && 'edge' || github.ref }}-${{ inputs.ref || '' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  REGISTRY: ghcr.io/senseplane-ai

jobs:
  # What to build and how to tag it.
  prepare:
    # Not on forks; edge only after a successful ci run on a push to main.
    if: >-
      github.repository == 'senseplane-ai/senseplane' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
      latest: ${{ steps.plan.outputs.latest }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.ref }}
          fetch-depth: 0 # every tag: is this the newest stable release?
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(git rev-parse HEAD)
          latest=false
          prerelease=false
          case "$EVENT" in
            push)
              mode=release
              # The tag must be the version in package.json, and every image reference its release line.
              node scripts/version.mjs check --tag "$TAG"
              version=${TAG#v}
              tags="$version"
              if [[ "$version" == *-* ]]; then
                prerelease=true
              else
                line=$(cut -d. -f1-2 <<< "$version")
                tags="$tags"$'\n'"$line"
                newest=$(git tag -l 'v*.*.*' | grep -Ev -- '-' | sort -V | tail -n 1)
                if [[ "$newest" == "$TAG" ]]; then latest=true; tags="$tags"$'\n'latest; fi
              fi
              ;;
            workflow_run) mode=edge; version=edge; tags=edge ;;
            *) mode=manual; version="$sha"; tags="" ;;
          esac
          tags="$tags"$'\n'"$sha"
          {
            echo "mode=$mode"
            echo "sha=$sha"
            echo "version=$version"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
            echo "tags<<EOF"
            sed '/^$/d; s/^/type=raw,value=/' <<< "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $mode build of \`$sha\`"
            echo
            echo "Tags: $(sed '/^$/d' <<< "$tags" | paste -sd ' ' -)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Releases and manual builds pass every check first (edge runs only after ci passed).
  ci:
    needs: prepare
    if: needs.prepare.outputs.mode != 'edge'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # One image per service and architecture, pushed by digest (no tags yet).
  build:
    needs: [prepare, ci]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        service: [api, mcp, media, console, brain, bridge]
        arch: [amd64, arm64]
        include:
          - { service: api, context: ".", file: api/Dockerfile, description: "Senseplane API: the public REST API" }
          - { service: mcp, context: ".", file: mcp/Dockerfile, description: "Senseplane MCP server" }
          - { service: media, context: ".", file: media/Dockerfile, description: "Senseplane media plane (bundled open-source server)", licenses: "Apache-2.0 AND LGPL-2.1-or-later" }
          - { service: console, context: ".", file: console/Dockerfile, description: "Senseplane console, served by Caddy (the self-host front door)" }
          - { service: brain, context: brain, file: brain/Dockerfile, description: "Senseplane brain: perception, episodes, watches, memory" }
          - { service: bridge, context: bridge, file: bridge/Dockerfile, description: "Senseplane bridge: relays RTSP cameras over WHIP, outbound only" }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The checkout is a detached commit, which the git context can't name; the tags are explicit.
          context: workflow
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.title=senseplane-${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses || 'Apache-2.0' }}
            org.opencontainers.image.vendor=The Senseplane Authors
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures under one multi-arch tag set, then a keyless signature.
  merge:
    needs: [prepare, build]
    # Explicit: a skipped ci (edge builds) would otherwise skip everything after build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [api, mcp, media, console, brain, bridge]
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    env:
      IMAGE: ghcr.io/senseplane-ai/${{ matrix.service }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          context: workflow
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.tags }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          META: ${{ steps.meta.outputs.json }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$META")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$META")
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "expected 2 platform digests, got ${#refs[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$SHA"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          {
            echo "**$IMAGE@$DIGEST**"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$META"
          } >> "$GITHUB_STEP_SUMMARY"

  # A tag's GitHub Release: its notes, the pull commands, and docker-compose.yml.
  github-release:
    needs: [prepare, merge]
    if: ${{ !cancelled() && needs.merge.result == 'success' && needs.prepare.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # the annotated tag's message
          persist-credentials: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" # the annotated tag itself
          line=$(cut -d. -f1-2 <<< "${VERSION%%-*}")
          {
            git for-each-ref "refs/tags/$TAG" --format='%(contents)'
            echo
            echo "## Images"
            echo
            echo "linux/amd64 and linux/arm64, signed with cosign (keyless), with SBOM and provenance attestations:"
            echo
            for s in api mcp media console brain bridge; do echo "- \`$REGISTRY/$s:$VERSION\`"; done
            echo
            echo "## Run it"
            echo
            echo "Download \`docker-compose.yml\` below, edit its settings block, then \`docker compose up -d\`"
            echo "([docs/self-host-vm.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/self-host-vm.md))."
            if [ "$PRERELEASE" != true ]; then
              echo "It pulls the \`:$line\` release line, which now points at $VERSION."
            fi
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.yml --clobber
          else
            flags=(--verify-tag --title "Senseplane $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" docker-compose.yml "${flags[@]}"
          fi

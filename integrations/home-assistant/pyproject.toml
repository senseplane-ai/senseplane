# Test harness for the Home Assistant integration (the integration itself ships
# as custom_components/senseplane; Home Assistant provides aiohttp at runtime).
[project]
name = "senseplane-home-assistant"
version = "0.1.0"
description = "Senseplane custom integration for Home Assistant (tests)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "aiohttp>=3.10",
  "pytest>=8.4",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

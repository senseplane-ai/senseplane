# The Senseplane add-on (ADR 0061): the bridge, reading this Home Assistant
# through the Supervisor and relaying IP cameras, paired with a code.
name: Senseplane
version: "0.3.0"
slug: senseplane
description: Eyes and ears for your AI agents. Sends the sensors you choose, and your IP cameras, to Senseplane.
url: https://github.com/senseplane-ai/senseplane/tree/main/integrations/home-assistant-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/senseplane-ai/bridge-addon
init: false
startup: application
boot: auto
# Reads states, areas and entities; never calls a service.
homeassistant_api: true
# On the home network itself, to find ONVIF cameras (a multicast probe that
# cameras answer directly, ADR 0063). The panel still answers only the
# Supervisor. Nothing listens for the internet.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:eye-outline
panel_title: Senseplane
watchdog: http://[HOST]:[PORT:8099]/healthz
# MQTT in and out (ADR 0071), off until `mqtt` is on: the Mosquitto add-on is
# found through the Supervisor unless `mqtt_url` names another broker.
services:
  - mqtt:want
options:
  server: ""
  name: ""
  mqtt: false
  mqtt_topics: []
schema:
  server: url
  name: str?
  mqtt: bool
  mqtt_url: str?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str?
  mqtt_sensors: bool?
  mqtt_topics:
    - str

#
# The end-to-end suite (`pnpm e2e`, e2e/run.ts): one compose stack built from
# this checkout, every backend check (perception through signed webhooks
# included), then the console journey in Chrome. Model answers are replayed
# from e2e/fixtures/model-replay.json, so no secrets are needed and a run
# costs nothing. The website check (m4-5) is skipped here: it needs a website
# checkout (E2E_SITE_DIR). It takes about an hour, so it runs after merges, nightly
# and on demand, not on every pull request (ci.yml).
name: e2e
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Checks to run, comma-separated (empty: all; e.g. m3,journey)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A newer push to main replaces a run still going; nightly and manual runs queue separately.
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The stack's images and volumes need about 10 GB (run.ts checks); the
      # runner's preinstalled Android, .NET and Haskell toolchains aren't used.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # The whip check builds the bridge's Go WHIP client.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tools
        run: |
          docker compose version
          /usr/bin/google-chrome --version
          go version
          ffprobe -version | head -n 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: pnpm e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ONLY: ${{ inputs.only }}
        run: pnpm e2e ${ONLY:+--only "$ONLY"}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/.artifacts/logs
            e2e/.artifacts/screenshots
            e2e/.artifacts/results.json
          if-no-files-found: ignore
          retention-days: 14

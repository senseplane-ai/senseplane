# Prometheus for the `observability` profile: scrapes the Collector, which
# gathers every Senseplane service's /metrics (otel-collector.yaml).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

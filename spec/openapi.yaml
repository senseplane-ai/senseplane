openapi: 3.1.0
info:
  title: Senseplane API
  version: 0.1.0
  description: Eyes and ears for your agent. Public REST API, base path /v1.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "{baseUrl}"
    description: Your Senseplane API. The self-host default is http://localhost:8080/v1.
    variables:
      baseUrl:
        default: http://localhost:8080/v1
security:
  - bearerAuth: []
tags:
  - name: sources
  - name: clips
  - name: stories
    description: One video from many moments across cameras, in time order (ADR 0070).
  - name: follows
    description: Following an object or a pet across cameras, never a person (ADR 0070).
  - name: watches
  - name: events
  - name: memory
  - name: activity
    description: Activities (one thing, in one place, from a start to an end) and questions about them (ADR 0057).
  - name: webhooks
  - name: channels
    description: >-
      Telegram chats that watches send alerts to and that can ask about the cameras (ADR 0059).
      A chat is linked by opening a one-time link and pressing Start; it then asks as an agent
      of kind `channel`, whose grants apply.
  - name: agents
    description: Agent keys. An agent sees only what its grants allow (ADR 0024).
  - name: grants
  - name: audit
  - name: usage
  - name: account
  - name: team
    description: >-
      Members, roles and invites for console users (ADR 0044). Roles apply to console
      sessions: viewer reads; member also creates watches, clips and conversations;
      admin does everything except deleting the workspace and changing owners; owner
      does everything. API keys keep their own rules (account keys: full access;
      agent keys: their grants). A refused role answers 403 `forbidden_role`.
  - name: demo
  - name: conversations
    description: Ask about what your sources saw and heard (ADR 0041).
  - name: inbox
    description: Events routed to an agent by watches (ADR 0043).
  - name: bridge
    description: The bridge's own API, authenticated with a bridge token (ADR 0045), and pairing a box with a code (ADR 0061).
  - name: bridges
    description: Bridges and Home Assistant boxes, and which of their sensors Senseplane gets (ADR 0061).
  - name: devices
    description: >-
      Switching devices, only when a person asks (ADR 0067). A device is an entity a box
      lists with the actions it can run. It is switched only after an admin makes it
      controllable, by a person (member and up, or a workspace key) or an agent with a
      `control` grant on its source; `sensors` never implies `control`. Locks, garage
      doors, gates and alarms are secure: a person confirms their own request
      (`confirm: true`) and an agent's waits for a person (GET /confirmations). Heaters,
      ovens, medical devices and machinery are never offered. The box reads the state back,
      so an answer never says done when the state didn't change. Every attempt is in the
      audit log. Watches, workflows and scheduled jobs never switch anything.
paths:
  /sources:
    post:
      operationId: createSource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      description: >-
        Fails with 409 `source_limit_reached` when the account already has the
        quota provider's `max_registered_sources` (no limit by default; ADR 0025).
      summary: Add a source; returns its capture URL and token
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listSources
      summary: List sources
      tags: [sources]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Source'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}:
    get:
      operationId: getSource
      summary: Get a source
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateSource
      summary: Update name, location, zones, privacy masks or audio recording
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSource
      summary: Remove a source and schedule deletion of its data
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/capture-link:
    post:
      operationId: rotateCaptureLink
      summary: Issue a new capture link for a source and invalidate every earlier one
      description: >-
        Owner keys only. The new link is unbound until a device first joins
        with it (within 10 minutes). Use this when a capture link or QR code
        may have been seen by someone else, or to move the camera to a new
        device (ADR 0038).
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: 'schemas/source.json'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/now:
    get:
      operationId: getSourceNow
      summary: Latest snapshot or sensor values
      description: 'Sensors: the latest reading per sense and device; a state also says since when it has held.'
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceNow'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/ask:
    post:
      operationId: askSource
      summary: Ask a question about the current scene
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AskResponse'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/playback:
    get:
      operationId: getPlayback
      summary: Signed HLS URL for a range within the source's retention (up to 24 h per playlist)
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
        - name: from
          in: query
          required: true
          description: Range start (RFC 3339)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          description: Range end (RFC 3339)
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybackResponse'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/timeline:
    get:
      operationId: getTimeline
      summary: Recorded ranges and gaps for a time window (for the console timeline)
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
        - {name: from, in: query, required: false, description: Range start (default 24 h ago), schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, description: Range end (default now), schema: {type: string, format: date-time}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimelineResponse'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/history:
    get:
      operationId: getHistory
      summary: Sensor time series
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
        - name: from
          in: query
          required: false
          description: Range start (RFC 3339)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Range end (RFC 3339)
          schema: {type: string, format: date-time}
        - name: sense
          in: query
          required: false
          description: Sensor sense
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryResponse'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/readings:
    post:
      operationId: postReadings
      summary: Push sensor readings
      description: >-
        Takes an account API key or the sensor's integration token (`sit_…`,
        returned when the sensor source is created; ADR 0045). Numbers, on/off
        states and events (ADR 0060); a sense the sensor doesn't have yet is
        added to it. Sensor watches that hold long enough fire `reading.threshold`;
        `sensor_thresholds` fire `sensor.threshold`.
      security:
        - bearerAuth: []
        - integrationToken: []
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadingsRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, events]
                properties:
                  accepted: {type: integer}
                  events: {type: array, items: {type: string}, description: IDs of events these readings fired}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/ingest-token:
    post:
      operationId: rotateIngestToken
      summary: Rotate a source's ingest token (WHIP, bridge or sensor integration)
      description: >-
        Issues a new token and revokes the previous one. `whip` sources: a new
        WHIP bearer token; a publisher still connected with the old one is
        disconnected. `rtsp` sources: a new token for the camera's bridge (every
        camera on that bridge is re-keyed and disconnected until the bridge
        restarts with it). `sensor` sources: a new integration token. Other
        types: 400 `validation_failed`. Audited.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: {type: string, description: Shown only once}
                  whip_url: {type: string, format: uri, description: whip sources}
                  bridge_token: {type: string, description: rtsp sources (same as token)}
                  bridge_id: {type: string, description: rtsp sources}
                  docker_command: {type: string, description: rtsp sources}
                  integration_token: {type: string, description: sensor sources (same as token)}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeIngestToken
      summary: Revoke a source's ingest token
      description: >-
        Revokes the source's WHIP, bridge or integration token and disconnects
        live publishers (for `rtsp`, every camera on the bridge). Publishing
        fails with 401 until a new token is rotated in. Audited.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Error'}
  # --- Pause and resume (ADR 0045 addendum) --------------------------------------
  /sources/{id}/pause:
    post:
      operationId: pauseSource
      summary: Pause a camera; it records and analyses nothing until resumed
      description: >-
        Sets `status` to `paused` and ends the camera's live session. While
        paused, pushes (WHIP, bridge, capture link) are refused with 409
        `conflict` (`details.reason: paused`) and bridges drop the camera from
        their config. Sensors can't be paused (409). Idempotent. Audited.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The source, now paused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/resume:
    post:
      operationId: resumeSource
      summary: Resume a paused camera
      description: >-
        Sets `status` to `offline` until its publisher connects again (a bridge
        picks the camera up within a minute; a phone opens its capture link
        again). Idempotent. Audited.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  # --- end Pause and resume ------------------------------------------------------
  # --- Live view (ADR 0042) -------------------------------------------------
  /sources/{id}/live:
    post:
      operationId: startLiveView
      summary: Start watching a source live
      description: >-
        Returns a single-use media token and the signalling URL. The browser
        joins with the token over the media signalling protocol (v1) and
        consumes the camera's video, and its audio only when `audio` is true,
        the caller has an audio grant for the source and the source records
        audio. Nothing is transcoded; privacy masks don't apply (they apply to
        analysis frames, snapshots and model inputs). Viewers with no
        keepalive (`POST /live/{session_id}/keepalive`, sent on user activity)
        for `idle_timeout_seconds` are closed. Needs a video grant
        (agent keys). Errors: 403 `feature_not_available` when the deployment's
        quota provider turns live view off; 429 `limit_reached` when the
        account's live view minutes are used up or too many people are
        watching at once (`details.limit` names the limit); 409 `conflict`
        when the source isn't streaming. Each start is written to the audit
        log. Viewing time is metered as `live_view_minutes` in `GET /usage`.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LiveViewRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiveViewSession'}
        default: {$ref: '#/components/responses/Error'}
  /live/{session_id}/keepalive:
    post:
      operationId: keepLiveViewAlive
      summary: Tell the API someone is still watching
      description: >-
        Sent by the viewer on user activity (pointer, keys, touch, the tab
        becoming visible), at most every 30 s, never on a timer alone. A live
        session with no keepalive for `idle_timeout_seconds` is ended with
        `roomClosed` reason `idle` (ADR 0042, 0049). 404 when the session has
        ended.
      tags: [sources]
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [idle_timeout_seconds]
                properties:
                  idle_timeout_seconds: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/speak:
    post:
      operationId: speak
      summary: Say something through a camera's speaker
      description: >-
        Text to speech, played on the camera (ADR 0069), after a short chime, in a plainly
        synthetic voice: there is no voice choice and no voice cloning (unknown fields such as
        `voice` are refused). An agent needs a `speak` grant on the source; `sensors` never
        implies it. People need member and up. The camera must have a speaker (409
        `no_speaker`), a message is at most 30 seconds (400 `message_too_long`), 6 messages a
        minute per camera (429 `rate_limited`), one speaker at a time: 409 `speaker_busy`
        while a person is talking through it or another message is playing, and a person's
        push-to-talk cuts an agent's message off. A camera that isn't connected answers 503
        `camera_offline`; a box that doesn't take the message within 10 s never plays it later.
        The clip is kept (sealed like snapshots) so a person can hear exactly what was said, and
        every message is in the audit log with who, the camera, the duration and the text.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpeakRequest'}
      responses:
        '200':
          description: Played (or playing) on the camera
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpeakMessage'}
        '202':
          description: Sent to the camera's box and not reported yet; poll GET /speak-messages/{id}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpeakMessage'}
        default: {$ref: '#/components/responses/Error'}
  /speak-messages:
    get:
      operationId: listSpeakMessages
      summary: What was said through cameras, newest first
      description: Agent messages, watch messages and people's push-to-talk, each with a link to hear the clip (agents and watches). An agent sees only its own.
      tags: [sources]
      parameters:
        - {name: source, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SpeakMessage'}}
        default: {$ref: '#/components/responses/Error'}
  /speak-messages/{id}:
    get:
      operationId: getSpeakMessage
      summary: One message said through a camera
      description: An agent sees only its own.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpeakMessage'}
        default: {$ref: '#/components/responses/Error'}
  # --- end live view --------------------------------------------------------
  # --- Ingest: bridge and integrations (ADR 0045) -----------------------------
  /bridge/config:
    get:
      operationId: getBridgeConfig
      summary: The cameras this bridge should relay
      description: >-
        Called by the bridge every `poll_seconds`. Cameras without an RTSP URL
        yet are left out until the bridge claims them with POST /bridge/cameras.
        The bridge pushes each camera to its `whip_url` with the camera's
        `whip_token` (a WHIP bearer; rotating the bridge token retires them).
      tags: [bridge]
      security:
        - bridgeToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeConfig'}
        default: {$ref: '#/components/responses/Error'}
  /bridge/cameras:
    post:
      operationId: claimBridgeCamera
      summary: Claim or add a camera by RTSP URL (the bridge's `--rtsp`)
      description: >-
        The same URL again returns that camera (200). Otherwise the oldest camera
        on this bridge still waiting for a URL takes it (200), or a new `rtsp`
        source is added to the bridge (201; `source_limit_reached` applies).
        The URL is stored encrypted. Audited.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rtsp_url]
              properties:
                rtsp_url: {type: string, pattern: '^rtsps?://', maxLength: 2048}
                name: {type: string, minLength: 1, maxLength: 120}
                speaker: {type: boolean, description: 'The camera has two-way audio the box can play to (an ONVIF backchannel), or is the phone itself (ADR 0069)'}
      responses:
        '200':
          description: Existing camera
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCamera'}
        '201':
          description: Camera added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCamera'}
        default: {$ref: '#/components/responses/Error'}
  /bridge/health:
    post:
      operationId: postBridgeHealth
      summary: Heartbeat and per-camera state
      description: >-
        Sent every `heartbeat_seconds` and whenever a camera's state changes.
        `reconnecting` and `offline` set the source's status; `online` sets it
        online (the media plane confirms). A bridge silent for three heartbeats
        has its cameras marked offline.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BridgeHealth'}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Error'}
  /bridge/entities:
    get:
      operationId: getOwnBridgeEntities
      summary: This box's entities and which are chosen
      tags: [bridge]
      security:
        - bridgeToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BridgeEntity'}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putBridgeEntities
      summary: The Home Assistant entities this bridge can send
      description: >-
        Replaces the list (ADR 0061). Entities it no longer lists stay, marked
        `listed: false`, and stop being sent.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entities]
              properties:
                entities: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/BridgeEntityListed'}}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Error'}
  /bridge/cameras-found:
    put:
      operationId: putBridgeCamerasFound
      summary: The cameras this box found, to pick from
      description: >-
        Replaces the list (ADR 0063): ONVIF cameras on the box's network, each
        with the Home Assistant camera it matches (same address or MAC), and
        Home Assistant's cameras that match none. Never credentials.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cameras]
              properties:
                cameras: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/BridgeCameraFoundListed'}}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Error'}
  /bridge/entities/choose:
    post:
      operationId: chooseOwnBridgeEntities
      summary: A box choosing its own sensors
      description: >-
        The person holding a paired phone chooses its sensors on it (ADR 0064),
        as an admin would with PATCH /bridges/{id}/entities. Audited as the bridge.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                choose: {type: array, maxItems: 1000, items: {type: string}}
                drop: {type: array, maxItems: 1000, items: {type: string}}
      responses:
        '204': {description: Done}
        default: {$ref: '#/components/responses/Error'}
  /bridge/readings:
    post:
      operationId: postBridgeReadings
      summary: Readings of the chosen Home Assistant entities
      description: >-
        Each reading names its entity as `device.id`; it is filed under the
        sensor source of the entity's room. Readings of entities nobody chose,
        unknown ones, or of another sense than the entity's are ignored.
      tags: [bridge]
      security:
        - bridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadingsRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, ignored, events]
                properties:
                  accepted: {type: integer}
                  ignored: {type: integer}
                  events: {type: array, items: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /bridge/commands:
    get:
      operationId: takeBridgeCommands
      summary: Work for this box, long-polled
      description: >-
        Waits up to `wait` seconds (at most 25) for work and hands over what is
        waiting, once (ADR 0062); its arguments are cleared from the server as
        it is taken. The box reports each with POST /bridge/commands/{id}.
      tags: [bridge]
      security:
        - bridgeToken: []
      parameters:
        - {name: wait, in: query, required: false, description: Seconds to wait for work (0–25), schema: {type: integer, minimum: 0, maximum: 25}}
      responses:
        '200':
          description: The work taken (possibly none)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, kind, args]
                      properties:
                        id: {type: string}
                        kind: {type: string}
                        args: {type: object}
        default: {$ref: '#/components/responses/Error'}
  /bridge/commands/{id}:
    post:
      operationId: finishBridgeCommand
      summary: How a command went
      tags: [bridge]
      security:
        - bridgeToken: []
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ok]
              properties:
                ok: {type: boolean}
                result: {type: object}
                error: {type: string, maxLength: 500}
      responses:
        '204': {description: Recorded}
        default: {$ref: '#/components/responses/Error'}
  /bridge/outputs:
    get:
      operationId: takeBridgeOutputs
      summary: What this box may publish to its MQTT broker, long-polled
      description: >-
        MQTT out (ADR 0071). Only when the account turned `mqtt_publish` on for
        this box (PATCH /bridges/{id}); otherwise `mqtt_publish` is false and
        the lists are empty. The cameras with their online state, the watches
        that alert, and the person, vehicle and animal detections and watch
        firings of those watches after `after`, in order. On and without `after`, it answers at
        once with no events and a `cursor` at the newest event (old events are
        not replayed); otherwise it waits up to `wait` seconds (at most 25) for
        one, or for publishing to be turned on or off.
      tags: [bridge]
      security:
        - bridgeToken: []
      parameters:
        - {name: after, in: query, required: false, description: The cursor from the last answer, schema: {type: string}}
        - {name: wait, in: query, required: false, description: Seconds to wait for an event (0–25), schema: {type: integer, minimum: 0, maximum: 25}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeOutputs'}
        default: {$ref: '#/components/responses/Error'}
  /bridge/pair:
    post:
      operationId: startBridgePairing
      summary: Ask for a pairing code (a box without a token)
      description: >-
        No authentication (ADR 0061); limited per address. The box shows
        `user_code` and `verification_url_complete`, then polls POST
        /bridge/pair/token every `interval` seconds with `device_code`.
      tags: [bridge]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120, description: What the person sees when approving}
      responses:
        '201':
          description: A code waiting for a person
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_url, verification_url_complete, expires_in, interval]
                properties:
                  device_code: {type: string, description: Secret; only the box has it}
                  user_code: {type: string, example: BCDF-GHJK}
                  verification_url: {type: string, format: uri}
                  verification_url_complete: {type: string, format: uri}
                  expires_in: {type: integer, description: Seconds}
                  interval: {type: integer, description: Seconds between polls}
        default: {$ref: '#/components/responses/Error'}
  /bridge/pair/token:
    post:
      operationId: pollBridgePairing
      summary: Whether the code was approved; the bridge token, once
      tags: [bridge]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: {type: string}
      responses:
        '200':
          description: '`waiting`, `expired`, or `approved` with the token (given once; asking again is a 409)'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [waiting, expired, approved]}
                  bridge_id: {type: string}
                  token: {type: string}
                  interval: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  /bridges:
    get:
      operationId: listBridges
      summary: Bridges and Home Assistant boxes
      tags: [bridges]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Bridge'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBridge
      summary: Add a bridge without a camera (for example a Home Assistant box run with a token)
      tags: [bridges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Created; `token` is shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bridge'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}:
    patch:
      operationId: updateBridge
      summary: Rename a box, or turn publishing to MQTT on or off
      description: >-
        `mqtt_publish` (off by default) lets the box publish this account's
        camera online state, person, vehicle and animal detections and watch
        firings to its MQTT broker as Home Assistant discovery entities
        (ADR 0071). Audited.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                mqtt_publish: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bridge'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeBridge
      summary: Remove a bridge (box)
      description: >-
        Its token stops working at once (a paired phone or add-on shows a new
        pairing code), and its cameras' live streams are cut off. Its cameras
        and sensor sources stay with what they recorded, offline and no longer
        tied to a bridge; delete them separately. Audited.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '204': {description: Removed}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/entities:
    get:
      operationId: listBridgeEntities
      summary: A bridge's Home Assistant entities, chosen or not
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BridgeEntity'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: chooseBridgeEntities
      summary: Choose which entities Senseplane gets
      description: >-
        A chosen entity's readings go to the sensor source of its room (one per
        bridge and room, made on first use: "Kitchen sensors"; no room: "Home
        sensors"). Dropping one stops its readings; what was stored stays.
        Audited.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                choose: {type: array, maxItems: 1000, items: {type: string}}
                drop: {type: array, maxItems: 1000, items: {type: string}}
      responses:
        '200':
          description: The entities after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BridgeEntity'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/matter:
    post:
      operationId: addMatterDevice
      summary: Add a Matter device through the box
      description: >-
        With the pairing code a person got by sharing the device from its own
        app (Apple Home, Google Home, the maker's app) or from its label: 11
        or 21 digits, or an `MT:` QR payload. The box commissions it over the
        network (ADR 0062); follow GET /bridges/{id}/commands/{cid}. Admins only. Audited.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, minLength: 8, maxLength: 64}
      responses:
        '202':
          description: Handed to the box
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCommand'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/commands/{cid}:
    get:
      operationId: getBridgeCommand
      summary: How work handed to a box went
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
        - {name: cid, in: path, required: true, description: The command's id, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCommand'}
        default: {$ref: '#/components/responses/Error'}
  /devices:
    get:
      operationId: listDevices
      summary: Devices that can be switched
      description: >-
        Chosen entities of the workspace's boxes that offer an action their type allows, with
        their state. An agent sees the devices on sources it has a grant on; `can_control` says
        whether it may switch one.
      tags: [devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Device'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
  /devices/{id}:
    get:
      operationId: getDevice
      summary: One device
      tags: [devices]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateDevice
      summary: Make a device controllable, or not
      description: Admins and owners (and workspace keys); never agents. Show the device's `warning` first. Audited.
      tags: [devices]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [controllable]
              properties:
                controllable: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        default: {$ref: '#/components/responses/Error'}
  /devices/{id}/commands:
    post:
      operationId: controlDevice
      summary: Switch a device
      description: >-
        Checks that the device is controllable, the caller may switch it (an agent needs a
        `control` grant on its source), the action is offered and the rate (10 a minute per
        device), then the box runs it and reads the state back; the request waits up to 15 s.
        A secure device: a person's own request needs `confirm: true` (else 409
        `confirmation_required`), and an agent's or a workspace key's answers 202
        `awaiting_confirmation` until a person confirms it within 2 minutes. A box that
        doesn't take the command within 10 s answers 503 `device_offline` and never runs it
        later. Errors carry the recorded command in `details.command`. Every attempt is audited.
        A thermostat is set between 10 and 28 °C.
      tags: [devices]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
        - {name: X-Senseplane-Via, in: header, required: false, description: '`app` from the Android app (recorded as through what the person asked)', schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {$ref: '#/components/schemas/DeviceAction'}
                value: {type: [number, string, 'null'], description: 'Brightness or position 0–100, temperature in °C, or a mode (off, heat, cool, auto, heat_cool, dry, fan_only)'}
                confirm: {type: boolean, description: A person confirms their own request for a secure device}
      responses:
        '200':
          description: The box ran it; `status` is done, in_progress or unchanged, with the state read back
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCommand'}
        '202':
          description: Waiting for a person to confirm, or sent and not reported yet; poll GET /device-commands/{id}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCommand'}
        default: {$ref: '#/components/responses/Error'}
  /device-commands/{id}:
    get:
      operationId: getDeviceCommand
      summary: What happened to a request to switch a device
      description: An agent sees only its own requests.
      tags: [devices]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCommand'}
        default: {$ref: '#/components/responses/Error'}
  /confirmations:
    get:
      operationId: listConfirmations
      summary: Requests waiting for a person to confirm
      tags: [devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DeviceCommand'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
  /confirmations/{id}:
    post:
      operationId: decideConfirmation
      summary: Confirm or refuse a request
      description: >-
        Only a person signed in (member and up): never an agent, a workspace key, or whoever
        made the request. Approved, it runs at once and answers as POST /devices/{id}/commands;
        refused, 409 `confirmation_denied`; too late, 409 `confirmation_expired`; already answered
        (a second tap), 409 `conflict`, and nothing runs again. On approval the requesting agent must
        still have its Control grant (and the agent or key must not be revoked), or it is refused.
      tags: [devices]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approve]
              properties:
                approve: {type: boolean}
      responses:
        '200':
          description: Confirmed and run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCommand'}
        '202':
          description: Confirmed and sent; not reported yet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCommand'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/cameras-found:
    get:
      operationId: listBridgeCamerasFound
      summary: Cameras the box found on its network and in Home Assistant
      description: >-
        ONVIF cameras the box found (ADR 0063), named after the Home Assistant
        camera they match, and Home Assistant's cameras without ONVIF.
        `source_id` is set once one was added (the same address as one of the
        box's cameras).
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BridgeCameraFound'}}
                  next_cursor: {type: ['null', string]}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/cameras-found/search:
    post:
      operationId: searchBridgeCameras
      summary: Ask the box to look for cameras now
      description: The box looks every few minutes on its own; follow GET /bridges/{id}/commands/{cid}.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '202':
          description: Handed to the box
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCommand'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{id}/onvif:
    post:
      operationId: addOnvifCamera
      summary: Add a camera the box found, with its username and password
      description: >-
        The credentials go to the box sealed (ADR 0062) and are cleared once it
        takes them. The box asks the camera for its streams, picks the H.264
        one that fits the plan's `max_resolution` (the substream when the main
        stream is larger; nothing is transcoded) and adds it as one of its
        cameras; the RTSP address is stored encrypted, as for a camera added by
        its address. Follow GET /bridges/{id}/commands/{cid}: when done,
        `result.source_id` is the new camera. Admins only. Audited.
      tags: [bridges]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [camera, username, password]
              properties:
                camera: {type: string, maxLength: 200, description: The found camera's `id`}
                username: {type: string, minLength: 1, maxLength: 128}
                password: {type: string, maxLength: 256}
                name: {type: string, minLength: 1, maxLength: 120, description: 'Default: its Home Assistant name, else its model'}
      responses:
        '202':
          description: Handed to the box
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BridgeCommand'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/pair:
    get:
      operationId: findBridgePairing
      summary: The box waiting with a code
      tags: [bridges]
      parameters:
        - {name: code, in: query, required: true, description: 'The code the box shows (any case, with or without the dash)', schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [code, name, expires_at]
                properties:
                  code: {type: string}
                  name: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: approveBridgePairing
      summary: Connect the box with this code to this workspace
      description: Makes a bridge for the box; the box collects its token itself (ADR 0061). Admins only. Audited.
      tags: [bridges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, maxLength: 20}
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Paired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bridge'}
        default: {$ref: '#/components/responses/Error'}
  /integration:
    get:
      operationId: getIntegration
      summary: The sensor source an integration token feeds
      description: Lets an integration (Home Assistant) check its token and learn its source ID.
      tags: [sources]
      security:
        - integrationToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /integration/readings:
    post:
      operationId: pushWebhookReadings
      summary: The readings webhook (IFTTT, n8n, Zapier, ESPHome, Shelly, scripts)
      description: >-
        Takes a sensor's integration token (`sit_…`) and files the readings
        under its source (ADR 0071; recipes in docs/sensors-webhook.md). The
        body is `{"readings": [...]}` or one reading's fields, as JSON, a form
        or plain text holding JSON; with no body, one reading's fields as query
        parameters. Values may be text: numbers ("21.5"), true/false, on/off,
        1/0 and the sense's own words ("open", "closed", "wet", "dry"); a known
        number sense may leave out its unit; a device may be `device` or
        `device_id` and `device_name`; `measured_at` may be Unix seconds.
        With a signing secret on the token (POST /sources/{id}/webhook/secret),
        every push carries `Senseplane-Signature: t=<unix seconds>,v1=<hex
        HMAC-SHA256 of "<t>.<body>">`, as Senseplane signs its own webhooks
        (a push without a body signs its query string); a time more than 5
        minutes off, a mismatch or a signature already used answer 401, and
        that token may then use no other endpoint. `video`, `audio`, `sensors`
        and `control` are never readings. Limited per token like every key.
      tags: [sources]
      security:
        - integrationToken: []
      parameters:
        - {name: Senseplane-Signature, in: header, required: false, description: 'Required when the token has a signing secret', schema: {type: string}}
        - {name: sense, in: query, required: false, description: 'One reading in the query (no body)', schema: {type: string}}
        - {name: value, in: query, required: false, schema: {type: string}}
        - {name: unit, in: query, required: false, schema: {type: string}}
        - {name: device_id, in: query, required: false, schema: {type: string}}
        - {name: device_name, in: query, required: false, schema: {type: string}}
        - {name: detail, in: query, required: false, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookReadings'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/WebhookReading'}
          text/plain:
            schema: {type: string, description: 'JSON, as for application/json'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, events]
                properties:
                  accepted: {type: integer}
                  events: {type: array, items: {type: string}, description: IDs of events these readings fired}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/webhook:
    get:
      operationId: getReadingsWebhook
      summary: A sensor's readings webhook URL and whether its pushes are signed
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadingsWebhook'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/webhook/secret:
    post:
      operationId: createReadingsWebhookSecret
      summary: Turn on signing, or replace the secret
      description: >-
        Gives the sensor's current integration token a new signing secret,
        shown once; from now every push with that token must be signed. A
        rotated token keeps it. 409 when the sensor has no token. Audited.
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK; `secret` is shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadingsWebhookSecret'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteReadingsWebhookSecret
      summary: Turn signing off
      tags: [sources]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '204': {description: Signing is off}
        default: {$ref: '#/components/responses/Error'}
  # --- end ingest --------------------------------------------------------------
  /capture/join:
    post:
      operationId: captureJoin
      summary: Exchange a capture ticket (from capture_url) for a short-lived media join token
      description: >-
        Used by the capture page. Authenticated by the ticket, not an API key.
        Fails with 409 `source_limit_reached` when `max_active_sources` of the
        account's sources are already streaming (ADR 0025); the media plane
        enforces the same limit on `produce`. A capture link is bound to the
        first device that joins with it (`device`), and must be first used
        within 10 minutes of being issued; after that only the bound device
        can rejoin with it. Rotating the link (`POST /sources/{id}/capture-link`)
        invalidates every earlier link (ADR 0038).
      tags: [sources]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket: {type: string}
                device:
                  type: string
                  minLength: 16
                  maxLength: 128
                  description: A random key the capture page generates once and keeps on the device. Required to bind the link; without it, the link only works during its first 10 minutes.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, url, expires_at]
                properties:
                  token: {type: string, description: Join token for the media signalling `join` frame}
                  url: {type: string, format: uri, description: WebSocket signalling URL}
                  expires_at: {type: string, format: date-time}
                  max_resolution: {type: string, enum: [720p, 1080p], description: "The account's maximum recording resolution: request this size from the camera (ADR 0022)"}
        default: {$ref: '#/components/responses/Error'}
  /demo/sessions:
    post:
      operationId: createDemoSession
      summary: "Start a live demo (no sign-up): a temporary account, one phone source and a package/person watch"
      description: >-
        Rate-limited per IP per day; video only; the session lasts at most 10
        minutes and everything it created is deleted 1 hour after it ends.
        Browser CORS is limited to the website origins.
      tags: [demo]
      security: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoSession'}
        default: {$ref: '#/components/responses/Error'}
  /demo/sessions/{id}:
    delete:
      operationId: endDemoSession
      summary: End a demo session now (its data is deleted 1 hour later)
      tags: [demo]
      security: [{demoToken: []}]
      parameters:
        - {name: id, in: path, required: true, description: Demo session ID, schema: {type: string}}
      responses:
        '204': {description: Ended}
        default: {$ref: '#/components/responses/Error'}
  /demo/sessions/{id}/events:
    get:
      operationId: streamDemoEvents
      summary: Live stream (Server-Sent Events) of the session's events, camera status and snapshots
      description: >-
        text/event-stream. Event names: `status` ({camera: pending|online|offline}),
        `event` (an Event), `snapshot` ({url, captured_at}), `ended` ({reason}).
        Authenticate with the session token in the Authorization header.
      tags: [demo]
      security: [{demoToken: []}]
      parameters:
        - {name: id, in: path, required: true, description: Demo session ID, schema: {type: string}}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /demo/sessions/{id}/ask:
    post:
      operationId: askDemo
      summary: "Ask about the camera, live or from what it has seen"
      tags: [demo]
      security: [{demoToken: []}]
      parameters:
        - {name: id, in: path, required: true, description: Demo session ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [answer, from]
                properties:
                  answer: {type: string}
                  from: {type: string, enum: [live, memory]}
                  confidence: {type: number}
                  snapshot_url: {type: string, format: uri}
                  event: {$ref: '#/components/schemas/Event'}
        default: {$ref: '#/components/responses/Error'}
  /clips:
    post:
      operationId: createClip
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Save a time range as a permanent clip
      tags: [clips]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClipCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Clip'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listClips
      summary: List clips
      tags: [clips]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Clip'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /clips/{id}:
    get:
      operationId: getClip
      summary: Get a clip with a fresh signed playback URL
      tags: [clips]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Clip'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteClip
      summary: Delete a clip
      tags: [clips]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /stories:
    post:
      operationId: createStory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Make one video from many moments across cameras
      description: >-
        Moments (events, or time ranges on cameras) or a search are put in time order and
        made into one video: each piece labelled with its camera and time, a gap over a
        minute shown as a short "+3 min" card (labelled mode, 720p H.264), or the recordings
        copied untouched without labels (fast mode). It is rendered in the background: poll
        GET /stories/{id} until `ready`. At most 20 pieces and 10 minutes of video. The caller
        needs a video grant covering every piece (with history for older ones); sound only
        from cameras it has an audio grant on; a blurred-only agent is refused (recordings
        aren't blurred). Kept like a saved clip: raw retention doesn't delete it.
      tags: [stories]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoryCreate'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Story'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listStories
      summary: List stories
      tags: [stories]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–200, default 50)
          schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Story'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /stories/{id}:
    get:
      operationId: getStory
      summary: Get a story; once ready, with a fresh signed playback URL
      tags: [stories]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Story'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteStory
      summary: Delete a story and its video
      tags: [stories]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /stories/{id}/link:
    post:
      operationId: createStoryLink
      summary: A longer-lived signed link to share a ready story
      description: >-
        For sending to a person: up to 7 days (default 1 day). Like every media link it is
        checked on each request against the key that made it, so revoking that key or its
        grants, or deleting the story, ends it sooner (ADR 0036). Recorded in the audit log.
      tags: [stories]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in_s: {type: integer, minimum: 60, maximum: 604800}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /follows:
    post:
      operationId: createFollow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Follow an object or a pet across cameras (never a person)
      description: >-
        "How did this box move through the house?" Point at the thing (a box on an event's
        snapshot, or on a camera's recorded frame at a time) or describe it, and give a time
        range of at most 2 hours. A background job reads frames from each camera's
        recordings (a frame a second around events, one every five seconds otherwise; at
        most 240 frames and 12 vision model calls, metered as AI checks) and returns the
        route: visits per camera in time order, handovers, and the gaps where it was not
        seen. People are never followed: a description naming a person, or a box on one, is
        refused with `forbidden` and `details.person`. Cameras default to every one the
        caller may watch over the range; a blurred-only agent's are left out.
      tags: [follows]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FollowCreate'}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Follow'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listFollows
      summary: List follows (an agent sees its own)
      tags: [follows]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–200, default 50)
          schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Follow'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /follows/{id}:
    get:
      operationId: getFollow
      summary: Get a follow and the route it found, each visit with a signed playback URL
      tags: [follows]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Follow'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteFollow
      summary: Delete a follow (its story stays)
      tags: [follows]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /watches:
    post:
      operationId: createWatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Create a plain-language watch; returns the compiled form
      tags: [watches]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Watch'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listWatches
      summary: List watches
      tags: [watches]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Watch'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /watches/{id}:
    get:
      operationId: getWatch
      summary: Get a watch
      tags: [watches]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Watch'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateWatch
      summary: Edit, pause or resume a watch
      tags: [watches]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Watch'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteWatch
      summary: Delete a watch
      tags: [watches]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  # --- watch destinations (ADR 0043): backtest and agent inboxes -------------
  /watches/test:
    post:
      operationId: testWatch
      summary: Backtest a watch over recorded history
      description: >-
        Replays the watch's cheap trigger over the detections, sounds and
        readings stored for the range, then runs its model check (if it has one)
        on at most `max_checks` candidate snapshots. Each check is an AI check.
        Give an `instruction` (compiled first), a `compiled` watch, or a
        `watch_id`. Without a vision model, candidates come back unverified.
      tags: [watches]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchTestRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchTestResult'}
        default: {$ref: '#/components/responses/Error'}
  /inbox:
    get:
      operationId: listInbox
      summary: An agent's inbox of events routed to it by watches
      description: >-
        An agent key reads its own inbox; an account key names the agent.
        Newest first. Items are filtered by the agent's current grants.
      tags: [inbox]
      parameters:
        - name: agent
          in: query
          required: false
          description: Agent id (required with an account key)
          schema: {type: string}
        - name: unseen
          in: query
          required: false
          description: Only items not yet marked seen
          schema: {type: boolean}
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, data, next_cursor]
                properties:
                  agent_id: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/InboxItem'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /inbox/seen:
    post:
      operationId: markInboxSeen
      summary: Mark inbox items seen
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InboxSeenRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  # --- end watch destinations -------------------------------------------------
  /events:
    get:
      operationId: listEvents
      summary: Query events by source, type and time
      tags: [events]
      parameters:
        - name: source
          in: query
          required: false
          description: Filter by source ID
          schema: {type: string}
        - name: type
          in: query
          required: false
          description: 'Filter by event type: an exact type (detection.cup) or a prefix wildcard (detection.* for every detection)'
          schema: {type: string}
        - name: from
          in: query
          required: false
          description: Range start (RFC 3339)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Range end (RFC 3339)
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Event'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}:
    get:
      operationId: getEvent
      summary: Get one event with fresh signed snapshot and clip URLs
      tags: [events]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}/feedback:
    post:
      operationId: postFeedback
      summary: Mark an event relevant or not relevant
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /memory/search:
    get:
      operationId: searchMemory
      summary: Natural-language search over history
      tags: [memory]
      parameters:
        - name: q
          in: query
          required: true
          description: Natural-language question
          schema: {type: string}
        - name: from
          in: query
          required: false
          description: Range start (RFC 3339)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Range end (RFC 3339)
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemorySearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /watch-packs:
    get:
      operationId: listWatchPacks
      summary: Ready-made sets of watches for a use case
      tags: [watches]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPackList'}
        default: {$ref: '#/components/responses/Error'}
  /watch-packs/{id}/apply:
    post:
      operationId: applyWatchPack
      summary: Add a pack's watches on these sources
      description: >-
        Creates the pack's watches (or the ones named in `items`) on the
        sources: sentences are compiled like any watch, conditions and digests
        are added compiled, and a digest summarises the pack's own tracking
        watches. Times are in time_zone (default the workspace's).
      tags: [watches]
      parameters:
        - name: id
          in: path
          required: true
          description: Pack id (eldercare, home, shop, site)
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPackApply'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPackApplied'}
        default: {$ref: '#/components/responses/Error'}
  /activity/query:
    post:
      operationId: queryActivity
      summary: Answer a question about activities (count, duration, first/last, absence, order, trends)
      description: >-
        One structured question over activities (ADR 0057): presence of a
        label, a watch's activities, a sound or a sensor threshold, in a
        window in a time zone, optionally per hour, day, camera or site and
        compared with what is usual. The API does the arithmetic and reports
        how much of the window was recorded. Grants apply: presence and watch
        activities need video on their source, sounds audio.
      tags: [activity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityQuery'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityAnswer'}
        default: {$ref: '#/components/responses/Error'}
  /activity/check:
    post:
      operationId: checkActivityHistory
      summary: Look through recorded footage for something no watch tracked at the time
      description: >-
        Runs a watch's cheap trigger and model check over stored history (the
        same as POST /watches/test). With a watch_id, what it finds is kept as
        that watch's activities (marked `checked`), so later questions count it.
        Each model check is metered as an AI check.
      tags: [activity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityCheckRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityCheckResult'}
        default: {$ref: '#/components/responses/Error'}
  /activities:
    get:
      operationId: listActivities
      summary: List activities (newest first)
      tags: [activity]
      parameters:
        - {name: source, in: query, required: false, description: Source id or name, schema: {type: string}}
        - {name: kind, in: query, required: false, description: 'presence, sound or watch', schema: {type: string, enum: [presence, sound, watch]}}
        - {name: label, in: query, required: false, description: 'A label, sound class or watch id', schema: {type: string}}
        - {name: zone, in: query, required: false, description: Zone name, schema: {type: string}}
        - {name: from, in: query, required: false, description: 'Range start (RFC 3339; default 24 h ago)', schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, description: 'Range end (RFC 3339; default now)', schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, description: 'Page size (1–500, default 100)', schema: {type: integer}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityList'}
        default: {$ref: '#/components/responses/Error'}
  /webhooks:
    post:
      operationId: createWebhook
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Subscribe to event types
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listWebhooks
      summary: List webhooks
      tags: [webhooks]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Webhook'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      tags: [webhooks]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /webhooks/{id}/deliveries:
    get:
      operationId: listDeliveries
      summary: Delivery log for a webhook (newest first)
      tags: [webhooks]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
        - {name: limit, in: query, required: false, description: Page size (1–100, default 20), schema: {type: integer}}
        - {name: cursor, in: query, required: false, description: Cursor from a previous page, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Delivery'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /webhooks/{id}/deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliver
      summary: Queue a delivery again now
      tags: [webhooks]
      parameters:
        - {name: id, in: path, required: true, description: Resource ID, schema: {type: string}}
        - {name: deliveryId, in: path, required: true, description: Delivery ID, schema: {type: string}}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delivery'}
        default: {$ref: '#/components/responses/Error'}
  /channels:
    get:
      operationId: listChannels
      summary: List linked chats
      tags: [channels]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Channel'}}
                  next_cursor: {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /channels/telegram:
    get:
      operationId: getTelegram
      summary: Whether Telegram is set up on this server, and the bot's username
      tags: [channels]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [configured, mode, username]
                properties:
                  configured: {type: boolean}
                  mode: {type: [string, 'null'], enum: [polling, webhook, null]}
                  username: {type: [string, 'null']}
                  error: {type: string, description: Present when Telegram refused the token or can't be reached}
        default: {$ref: '#/components/responses/Error'}
  /channels/telegram/link:
    post:
      operationId: createTelegramLink
      summary: A one-time link that links a Telegram chat (valid 10 minutes)
      description: >-
        Open `url` and press Start to link a private chat, or `group_url` to add the bot to a
        group. The chat gets an agent with a grant on every current camera (questions only).
        503 when Telegram isn't set up (TELEGRAM_BOT_TOKEN).
      tags: [channels]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [url, group_url, bot_username, expires_at]
                properties:
                  url: {type: string}
                  group_url: {type: string}
                  bot_username: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /channels/{id}:
    patch:
      operationId: updateChannel
      summary: Rename, mute, or turn snapshots or questions on or off
      tags: [channels]
      parameters:
        - {name: id, in: path, required: true, description: Channel ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                snapshots: {type: boolean}
                can_ask: {type: boolean}
                muted_until: {type: [string, 'null'], format: date-time}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteChannel
      summary: Unlink a chat; its agent is revoked
      tags: [channels]
      parameters:
        - {name: id, in: path, required: true, description: Channel ID, schema: {type: string}}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /channels/{id}/test:
    post:
      operationId: testChannel
      summary: Send a test message to a chat
      tags: [channels]
      parameters:
        - {name: id, in: path, required: true, description: Channel ID, schema: {type: string}}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /keys:
    get:
      operationId: listKeys
      summary: List workspace keys (admins and owners)
      tags: [agents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/WorkspaceKey'}}
                  next_cursor: {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createKey
      summary: Create a workspace key (owners only)
      description: >-
        A key with full access to the workspace, for your own scripts and apps: adding cameras,
        managing watches, webhooks and channels. It acts above every role, so only an owner can make
        one. Never give it to an AI agent; agents get agent keys with grants. Shown once.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/WorkspaceKey'}
                  - type: object
                    required: [api_key]
                    properties:
                      api_key: {type: string, description: The key (sk_…). Shown only once.}
        default: {$ref: '#/components/responses/Error'}
  /keys/{id}:
    delete:
      operationId: deleteKey
      summary: Revoke a workspace key (owners only)
      tags: [agents]
      parameters:
        - {name: id, in: path, required: true, description: Key ID, schema: {type: string}}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /agents:
    post:
      operationId: createAgent
      summary: Create an agent and its API key (shown once)
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCreated'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listAgents
      summary: List agents
      tags: [agents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Agent'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /agents/connect:
    post:
      operationId: connectAgent
      summary: Approve an app (an MCP client) from the consent page
      description: >-
        Used by the console's MCP consent page (ADR 0048). Creates an agent of kind `app`
        named after the client, or reuses the live app with the same `client_name` and
        redirect host (port ignored, loopback as `localhost`), replacing its grants with this
        access. Returns a single-use connect code (2 minutes) that the MCP service redeems,
        with the nonce behind `binding`, for the app's key at `POST /auth/connect/redeem`.
        The key is never returned here. Admins and owners only (`forbidden_role`).
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentConnect'}
      responses:
        '201':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                required: [agent, code, expires_at, reused]
                properties:
                  agent: {$ref: '#/components/schemas/Agent'}
                  code: {type: string, description: 'Connect code (cc_…), for the MCP service only'}
                  expires_at: {type: string, format: date-time}
                  reused: {type: boolean, description: True when an existing app was reconnected}
        default: {$ref: '#/components/responses/Error'}
  /agents/{id}:
    delete:
      operationId: deleteAgent
      summary: Revoke an agent, its keys and its grants (effective on the next request)
      tags: [agents]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /grants:
    post:
      operationId: createGrant
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Give an agent scoped access
      tags: [grants]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Grant'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listGrants
      summary: List grants
      tags: [grants]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Grant'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /grants/{id}:
    delete:
      operationId: deleteGrant
      summary: Revoke a grant
      tags: [grants]
      parameters:
        - name: id
          in: path
          required: true
          description: Resource ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /audit:
    get:
      operationId: listAudit
      summary: Who accessed what, when
      tags: [audit]
      parameters:
        - name: from
          in: query
          required: false
          description: Range start (RFC 3339)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Range end (RFC 3339)
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /usage:
    get:
      operationId: getUsage
      summary: Usage meters for a period, with source counts against limits
      tags: [usage]
      parameters:
        - name: from
          in: query
          required: false
          description: Period start (RFC 3339; default the start of the current UTC month)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Period end (RFC 3339; default now)
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Usage'}
        default: {$ref: '#/components/responses/Error'}
  /account:
    get:
      operationId: getAccount
      summary: Get the account, including raw retention settings
      tags: [account]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAccount
      summary: Update the account name or raw retention (may be limited by the deployment's quota provider)
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAccount
      summary: Delete the account and all its data within 24 hours
      tags: [account]
      responses:
        '202':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /account/keys:
    get:
      operationId: getAccountKeys
      summary: The workspace's footage key, and a rotation in progress
      description: >-
        Recordings, clips, snapshots and exports are encrypted at rest with
        the workspace's key, which the server holds (ADR 0066). During a
        rotation, segments_left counts the recording segments still under an
        older key. Admins.
      tags: [account]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AccountKeys'}}}}
        default: {$ref: '#/components/responses/Error'}
  /account/keys/rotate:
    post:
      operationId: rotateAccountKeys
      summary: Rotate the workspace's footage key
      description: >-
        A new key encrypts new footage at once. A background job re-encrypts
        what was stored under the old key; when it is done (at least 15
        minutes after the start), the old key is deleted, so copies made
        before (backups, a leaked bucket) can't be read any more. Playback
        keeps working throughout. Owner only; agents can't.
      tags: [account]
      responses:
        '202': {description: Started, content: {application/json: {schema: {$ref: '#/components/schemas/AccountKeys'}}}}
        default: {$ref: '#/components/responses/Error'}
  /account/export:
    post:
      operationId: exportAccount
      summary: Start a full account export (JSON plus signed media links)
      tags: [account]
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportResponse'}
        default: {$ref: '#/components/responses/Error'}
  /account/export/{id}:
    get:
      operationId: getAccountExport
      summary: An export's status and its signed download link
      tags: [account]
      parameters:
        - name: id
          in: path
          required: true
          description: Export ID
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportResponse'}
        default: {$ref: '#/components/responses/Error'}
  # --- team and workspace (ADR 0044) -------------------------------------------
  /me:
    get:
      operationId: getMe
      summary: The signed-in console user, their role here and every workspace they belong to
      description: An API key (not a console session) gets `user` null and acts as an owner.
      tags: [team]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMe
      summary: Change your display name (console sessions only)
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MeUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /me/switch:
    post:
      operationId: switchWorkspace
      summary: Swap this console session for one in another workspace you belong to
      description: The current session ends; use the returned one. Sign-in opens the last workspace used.
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceSwitch'}
      responses:
        '200':
          description: A session in the other workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsoleSession'}
        default: {$ref: '#/components/responses/Error'}
  /members:
    get:
      operationId: listMembers
      summary: People in this workspace and their roles
      tags: [team]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role (admin; only an owner changes owners)
      description: Demoting the last owner answers 409 `conflict` with `details.reason` `last_owner`.
      tags: [team]
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberUpdate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeMember
      summary: Remove someone from the workspace (admin), or leave it (yourself)
      description: Their sessions here end at once. The last owner can't leave (409 `conflict`).
      tags: [team]
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /invites:
    post:
      operationId: createInvite
      summary: Invite someone by email (admin; only an owner invites an owner)
      description: >-
        Returns a single-use link to copy and send (no email is sent). Inviting the same
        address again replaces the earlier link. The invited person may sign up even when
        sign-up is closed. Rate limited per workspace.
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteCreated'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listInvites
      summary: Invites not yet accepted or withdrawn (admin)
      tags: [team]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Invite'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /invites/{id}:
    delete:
      operationId: revokeInvite
      summary: Withdraw an invite; its link stops working
      tags: [team]
      parameters:
        - name: id
          in: path
          required: true
          description: Invite ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  # --- Conversations (Ask; ADR 0041) -------------------------------------------
  /conversations:
    post:
      operationId: createConversation
      summary: Start a conversation
      tags: [conversations]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConversationCreate'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listConversations
      summary: Recent conversations, newest first
      tags: [conversations]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20)
          schema: {type: integer}
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Conversation'}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: A conversation with all its messages
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          description: Conversation ID
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteConversation
      summary: Delete a conversation and its messages
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          description: Conversation ID
          schema: {type: string}
      responses:
        '204':
          description: No content
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      summary: Ask a question; the answer cites moments from history or a live look
      description: >-
        The brain searches history, lists events, looks at cameras now and may
        suggest a watch, using only the sources and senses the key is granted.
        Every model call counts as an AI check (`ai_checks`, detail `chat`).
        With `Accept: text/event-stream` the answer streams as Server-Sent
        Events: `status` `{text}` while it works, `delta` `{text}` as it writes,
        `moment` (a Moment) when it first cites one, `suggested_watch`
        `{instruction, sources}`, then `done` `{message}` with the stored
        assistant Message, or `error` `{error}` (the error envelope's body).
        Otherwise the response is the assistant Message as JSON.
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          description: Conversation ID
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '200':
          description: The assistant message (JSON), or the event stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
            text/event-stream:
              schema: {$ref: '#/components/schemas/ConversationStreamEvent'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}/messages/{mid}/feedback:
    post:
      operationId: giveAnswerFeedback
      summary: Mark an answer helpful or not (null clears it)
      tags: [conversations]
      parameters:
        - {name: id, in: path, required: true, description: Conversation ID, schema: {type: string}}
        - {name: mid, in: path, required: true, description: Assistant message ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: {type: [string, 'null'], enum: [helpful, not_helpful, null]}
      responses:
        '200':
          description: The answer with its feedback
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        default: {$ref: '#/components/responses/Error'}
  # --- end Conversations -------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An account API key (full access) or an agent API key (limited to its grants).
    demoToken:
      type: http
      scheme: bearer
      description: Token returned by POST /v1/demo/sessions.
    bridgeToken:
      type: http
      scheme: bearer
      description: A bridge token (`brg_…`), returned when an rtsp source is created with a new bridge (ADR 0045).
    integrationToken:
      type: http
      scheme: bearer
      description: A sensor integration token (`sit_…`); it can only push readings to its own source (ADR 0045).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a create safe to retry. A repeat with the same key and the same body
        within 24 hours returns the first response (with `Idempotent-Replayed: true`)
        instead of creating again; the same key with a different body is refused with
        `idempotency_key_reused`. Keys are scoped to the account.
      schema: {type: string, maxLength: 255}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    AccountKeys:
      type: object
      required: [current_version, rotating]
      properties:
        current_version: {type: integer, minimum: 1}
        rotating: {type: boolean}
        rotation_started_at: {type: string, format: date-time}
        segments_left: {type: integer, minimum: 0}
    Sense: {$ref: './schemas/sense.json'}
    Source: {$ref: './schemas/source.json'}
    Trigger: {$ref: './schemas/trigger.json'}
    Watch: {$ref: './schemas/watch.json'}
    Event: {$ref: './schemas/event.json'}
    Clip: {$ref: './schemas/clip.json'}
    StoryCreate:
      type: object
      additionalProperties: false
      description: Moments, a search, or both.
      properties:
        title: {type: string, maxLength: 200}
        moments:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/StoryMoment'}
        search: {$ref: '#/components/schemas/StorySearch'}
        mode: {type: string, enum: [labelled, fast], description: 'labelled (default): re-encoded with labels and gap cards; fast: the recordings copied untouched'}
    StoryMoment:
      type: object
      additionalProperties: false
      description: An event (from a little before it to a little after it ended), or a source with from and to.
      properties:
        event: {type: string}
        source: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    StorySearch:
      type: object
      additionalProperties: false
      required: [q]
      description: Events found by meaning, as memory search does ("the courier"), within from–to (default the last 24 hours).
      properties:
        q: {type: string, minLength: 2, maxLength: 500}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        sources: {type: array, items: {type: string}, maxItems: 50}
        limit: {type: integer, minimum: 1, maximum: 20}
    Story:
      type: object
      required: [id, mode, status, pieces, bytes, has_audio, created_at]
      properties:
        id: {type: string, pattern: '^sty_[0-9A-HJKMNP-TV-Z]{26}$'}
        title: {type: string}
        mode: {type: string, enum: [labelled, fast]}
        status: {type: string, enum: [queued, rendering, ready, failed]}
        error: {type: string}
        pieces:
          type: array
          items: {$ref: '#/components/schemas/StoryPiece'}
        duration_ms: {type: integer}
        bytes: {type: integer}
        has_audio: {type: boolean}
        playback_url: {type: string, format: uri, description: 'Signed HLS URL, 15-minute expiry; only when ready.'}
        playback_expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        ready_at: {type: string, format: date-time}
    StoryPiece:
      type: object
      required: [source_id, source_name, from, to, audio]
      properties:
        source_id: {type: string}
        source_name: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        event_id: {type: string}
        audio: {type: boolean, description: Its sound is in the story (an audio grant on that camera)}
        recorded_ms: {type: integer, description: How much of it was recorded (after the render)}
        offset_ms: {type: integer, description: Where it starts in the story (after the render)}
        gap_before_ms: {type: integer, description: Time since the previous piece, when it is long enough for a card}
    FollowCreate:
      type: object
      additionalProperties: false
      required: [reference, from, to]
      properties:
        reference: {$ref: '#/components/schemas/FollowReference'}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        sources: {type: array, items: {type: string}, maxItems: 50, description: 'Cameras to look at; default every camera the caller may watch over the range (at most 8)'}
        make_story: {type: boolean, description: Make a story of the route (default true)}
    FollowReference:
      type: object
      additionalProperties: false
      description: >-
        What to follow: a box on an event's snapshot (`event`) or on a camera's recorded
        frame (`source` and `at`), as fractions of the picture; or a `description` (needs a
        vision model). Never a person.
      properties:
        event: {type: string}
        source: {type: string}
        at: {type: string, format: date-time}
        box:
          type: array
          minItems: 4
          maxItems: 4
          description: x1, y1, x2, y2 as fractions of the picture (0–1)
          items: {type: number, minimum: 0, maximum: 1}
        description: {type: string, minLength: 3, maxLength: 300, description: 'e.g. "the brown cardboard box with red tape"'}
    Follow:
      type: object
      required: [id, status, reference, sources, from, to, make_story, frames_examined, model_calls, created_at]
      properties:
        id: {type: string, pattern: '^fol_[0-9A-HJKMNP-TV-Z]{26}$'}
        status: {type: string, enum: [queued, running, done, failed, refused]}
        error: {type: string}
        reference:
          type: object
          description: Where the reference is (no pixels, no embedding)
          additionalProperties: true
        sources: {type: array, items: {type: string}}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        make_story: {type: boolean}
        story_id: {type: string}
        result: {$ref: '#/components/schemas/FollowResult'}
        frames_examined: {type: integer}
        model_calls: {type: integer}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    FollowResult:
      type: object
      properties:
        route:
          type: array
          description: Visits in time order
          items: {$ref: '#/components/schemas/FollowVisit'}
        handovers:
          type: array
          items: {$ref: '#/components/schemas/FollowHandover'}
        gaps:
          type: array
          items: {$ref: '#/components/schemas/FollowGap'}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        sightings:
          type: array
          items: {$ref: '#/components/schemas/FollowSighting'}
        cameras:
          type: array
          items: {$ref: '#/components/schemas/FollowCamera'}
        limits: {$ref: '#/components/schemas/FollowLimits'}
        story_note: {type: string}
    FollowCamera:
      type: object
      properties:
        source_id: {type: string}
        source_name: {type: string}
        frames_examined: {type: integer}
    FollowLimits:
      type: object
      properties:
        frames: {type: integer}
        frames_examined: {type: integer}
        frame_limit_reached: {type: boolean}
        model_calls: {type: integer}
        model_calls_cap: {type: integer}
    FollowVisit:
      type: object
      required: [source_id, source_name, from, to, sightings, confidence]
      properties:
        source_id: {type: string}
        source_name: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        sightings: {type: integer}
        confidence: {type: number}
        confirmed_by_model: {type: boolean}
        playback_url: {type: string, format: uri}
        playback_expires_at: {type: string, format: date-time}
    FollowHandover:
      type: object
      properties:
        from_source: {type: string}
        to_source: {type: string}
        left_at: {type: string, format: date-time}
        seen_at: {type: string, format: date-time}
        gap_ms: {type: integer}
    FollowGap:
      type: object
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        note: {type: string, description: 'Why it was not seen: no camera recording, not looked at, or not there'}
    FollowSighting:
      type: object
      properties:
        source_id: {type: string}
        at: {type: string, format: date-time}
        box: {type: array, items: {type: number}}
        confidence: {type: number}
        confirmed: {type: [boolean, 'null']}
    Grant: {$ref: './schemas/grant.json'}
    Webhook: {$ref: './schemas/webhook.json'}
    Channel: {$ref: './schemas/channel.json'}
    WorkspaceKey:
      type: object
      required: [id, name, key_prefix, created_at, last_used_at]
      properties:
        id: {type: string}
        name: {type: string}
        key_prefix: {type: string, description: The first characters of the key}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
    Usage: {$ref: './schemas/usage.json'}
    Reading: {$ref: './schemas/reading.json'}
    Error: {$ref: './schemas/error.json'}
    Account: {$ref: './schemas/account.json'}
    Delivery: {$ref: './schemas/delivery.json'}
    DemoSession: {$ref: './schemas/demo-session.json'}
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        time_zone: {type: string, maxLength: 64, description: "IANA time zone, e.g. Europe/Berlin (watch schedules, answers like \"this morning\")"}
        retention_days: {type: [integer, 'null'], minimum: 1, description: "Days mode; null keeps raw footage until deleted"}
        retention_mode: {type: string, enum: [days, fill]}
        retention_max_bytes: {type: [integer, 'null'], minimum: 1, description: "Fill mode byte cap; null uses the deployment's storage cap"}
        blur_faces: {type: boolean, description: 'Blur faces in snapshots and model inputs on cameras that do not set their own (ADR 0068)'}
        blur_plates: {type: boolean, description: 'Blur number plates likewise (a best effort, ADR 0068)'}
    SourceCreate:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        location: {type: string, maxLength: 120}
        site: {type: [string, 'null'], maxLength: 120, description: 'A place the source belongs to, for grouping questions across places'}
        type: {type: string, enum: [browser, sensor, whip, rtsp], description: 'browser sources get a capture link; whip sources get a WHIP URL and bearer token (OBS, encoders); rtsp sources are IP cameras relayed by a bridge and get a bridge token and docker command; sensor sources get an integration token for pushing readings'}
        record_audio: {type: boolean, default: false, description: Ignored for rtsp and sensor sources (bridge cameras are video only)}
        senses:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
          description: 'Sensor sources only; default temperature and humidity. A sensor source also gains each new sense its readings bring (spec/senses.json lists the known ones).'
        rtsp_url: {type: string, pattern: '^rtsps?://', maxLength: 2048, description: 'rtsp sources: the camera URL (stored encrypted). Without it the bridge claims the camera with --rtsp.'}
        bridge_id: {type: string, description: 'rtsp sources: add the camera to this existing bridge (needs rtsp_url; no new token is issued)'}
    SourceUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        location: {type: string, maxLength: 120}
        site: {type: [string, 'null'], maxLength: 120}
        record_audio: {type: boolean}
        sensor_thresholds:
          type: [object, 'null']
          description: 'Per number sense (temperature, humidity, power, ...): sensor.threshold fires when a reading crosses above or below'
          propertyNames: {pattern: '^[a-z][a-z0-9_]*$'}
          additionalProperties: {type: object, additionalProperties: false, properties: {above: {type: number}, below: {type: number}}}
        retention_days:
          type: [integer, 'null']
          minimum: 1
          description: Raw retention override in days; null uses the account value.
        retention_mode:
          type: [string, 'null']
          enum: [days, fill, null]
          description: Overrides the account's retention mode; null follows the account.
        retention_max_bytes:
          type: [integer, 'null']
          minimum: 1
          description: Fill mode byte cap for this source alone; null shares the account's cap.
        zones:
          type: array
          items:
            type: object
            required: [name, polygon]
            properties:
              name: {type: string}
              polygon: {type: array, items: {type: array, items: {type: number}}}
        privacy_masks: {type: array, items: {type: array, items: {type: array, items: {type: number}}}}
        blur_faces: {type: [boolean, 'null'], description: 'Blur faces on this camera (ADR 0068); null follows the account'}
        blur_plates: {type: [boolean, 'null'], description: 'Blur number plates on this camera (ADR 0068); null follows the account'}
    SourceNow:
      type: object
      required: [source_id, captured_at]
      properties:
        source_id: {type: string}
        captured_at: {type: string, format: date-time}
        snapshot_url: {type: string, format: uri}
        readings: {type: array, items: {$ref: '#/components/schemas/Reading'}}
    AskRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 3, maxLength: 500}
    AskResponse:
      type: object
      required: [answer, confidence, snapshot_url]
      properties:
        answer: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        snapshot_url: {type: string, format: uri}
    PlaybackResponse:
      type: object
      description: >-
        `url` is a signed HLS playlist (fMP4, EXT-X-DISCONTINUITY at gaps and
        recorder restarts) valid for 15 minutes. Ranges up to 24 h; anything
        older than the source's retention is gone.
      required: [url, expires_at]
      properties:
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        gaps:
          type: array
          items:
            type: object
            properties:
              from: {type: string, format: date-time}
              to: {type: string, format: date-time}
    TimeRange:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    TimelineResponse:
      type: object
      required: [from, to, recorded, gaps, retention_days]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        recorded: {type: array, items: {$ref: '#/components/schemas/TimeRange'}, description: Continuous recorded ranges (segments closer than 1.5 s are merged)}
        gaps: {type: array, items: {$ref: '#/components/schemas/TimeRange'}, description: Unrecorded spans between the first and last recording in the window}
        retention_days: {type: integer, description: Effective raw retention for this source}
    HistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Reading'}
    ReadingsRequest:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/ReadingInput'}
    WebhookReading:
      type: object
      required: [sense]
      description: >-
        One reading as the readings webhook takes it (ADR 0071): like
        ReadingInput, but `value` may be text and a known number sense's
        `unit` may be left out.
      properties:
        sense: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40}
        kind: {type: string, enum: [number, state, event]}
        value: {type: [number, boolean, string]}
        unit: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        detail: {type: string, maxLength: 64}
        device:
          type: object
          required: [id]
          properties:
            id: {type: string, minLength: 1, maxLength: 200}
            name: {type: string, maxLength: 200}
        device_id: {type: string, maxLength: 200}
        device_name: {type: string, maxLength: 200}
        measured_at: {type: [string, number], description: 'RFC 3339, or Unix seconds'}
    WebhookReadings:
      oneOf:
        - type: object
          required: [readings]
          properties:
            readings: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/WebhookReading'}}
        - {$ref: '#/components/schemas/WebhookReading'}
    ReadingsWebhook:
      type: object
      required: [url, token_prefix, signed]
      properties:
        url: {type: string, format: uri, description: The URL to push to}
        token_prefix: {type: [string, 'null'], description: 'The start of the current integration token; null when it has none'}
        signed: {type: boolean, description: Whether pushes with it must be signed}
    ReadingsWebhookSecret:
      type: object
      required: [url, token_prefix, signed, secret]
      properties:
        url: {type: string, format: uri}
        token_prefix: {type: [string, 'null']}
        signed: {type: boolean}
        secret: {type: string, description: 'whsec_…, shown once'}
    ReadingInput:
      type: object
      additionalProperties: false
      required: [sense]
      description: >-
        One reading (ADR 0060). A number needs `value` and `unit` (a known
        sense in its unit: temperature in celsius, power in watt, ...; spec/senses.json);
        a state needs `value` true or false (contact true = open, switch true = on, ...);
        an event needs neither (doorbell, button, with an optional `detail`).
        `kind` may be left out for known senses and is otherwise taken from `value`.
      properties:
        sense: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 40}
        kind: {type: string, enum: [number, state, event]}
        value: {type: [number, boolean]}
        unit: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        detail: {type: string, maxLength: 64, description: 'event only: single, double, long, ...'}
        device: {$ref: './schemas/reading.json#/$defs/device'}
        measured_at: {type: string, format: date-time, description: Defaults to now}
        at: {type: string, format: date-time, description: Alias of measured_at}
    BridgeCamera:
      type: object
      required: [source_id, name, rtsp_url, whip_url, whip_token]
      properties:
        source_id: {type: string}
        name: {type: string}
        rtsp_url: {type: string, description: The camera URL, credentials included (only ever sent to the bridge)}
        whip_url: {type: string, format: uri, description: Push here with whip_token}
        whip_token: {type: string, description: "This camera's WHIP bearer (spec/media/whip.md): a JWT the media plane verifies"}
    BridgeConfig:
      type: object
      required: [bridge_id, name, heartbeat_seconds, poll_seconds, cameras]
      properties:
        bridge_id: {type: string}
        name: {type: string}
        heartbeat_seconds: {type: integer}
        poll_seconds: {type: integer}
        cameras: {type: array, items: {$ref: '#/components/schemas/BridgeCamera'}, description: 'Empty when this deployment has no WHIP ingest'}
        sensors: {type: array, items: {type: string}, description: 'The Home Assistant entity ids a person chose (ADR 0061); the bridge sends readings of these only'}
        max_resolution: {type: string, enum: ['720p', '1080p'], description: "The plan's largest stream: a camera added from the list gets the profile that fits it"}
        features: {type: array, items: {type: string}, description: 'What this API takes that older ones may not, so a box sends it only when listed: `health_mqtt` (the `mqtt` field of POST /bridge/health)'}
    BridgeHealth:
      type: object
      additionalProperties: false
      required: [cameras]
      properties:
        version: {type: string, maxLength: 64}
        cameras:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [source_id, state]
            properties:
              source_id: {type: string}
              state: {type: string, enum: [connecting, online, reconnecting, offline]}
              detail: {type: string, maxLength: 500, description: Why, for reconnecting or offline}
              speaker: {type: boolean, description: 'What the box found about two-way audio when it connected (ADR 0069)'}
        home_assistant:
          type: object
          additionalProperties: false
          required: [connected]
          description: Set by a bridge that reads Home Assistant (ADR 0061)
          properties:
            connected: {type: boolean}
            entities: {type: integer, minimum: 0, description: How many entities it can send}
            sending: {type: integer, minimum: 0, description: How many a person chose}
        matter:
          type: object
          additionalProperties: false
          required: [connected]
          description: Set by a bridge that runs a Matter controller (ADR 0062)
          properties:
            connected: {type: boolean}
            nodes: {type: integer, minimum: 0}
        mqtt:
          type: object
          additionalProperties: false
          required: [connected]
          description: 'Set by a bridge with an MQTT broker (ADR 0071), when the config lists `health_mqtt`; its sensor sources are online while Home Assistant or the broker is reachable'
          properties:
            connected: {type: boolean}
            entities: {type: integer, minimum: 0}
        cameras_found: {type: integer, minimum: 0, description: 'Set by a bridge that looks for cameras (ADR 0063): how many it lists'}
    BridgeCommand:
      type: object
      required: [id, kind, status]
      properties:
        id: {type: string}
        kind: {type: string, description: 'matter_commission, onvif_add_camera, onvif_search, device_control or speak'}
        status: {type: string, enum: [pending, taken, done, failed, expired], description: '`expired`: not taken in time, so never handed out (device commands)'}
        result: {type: ['object', 'null']}
        error: {type: ['string', 'null']}
        created_at: {type: string, format: date-time}
        finished_at: {type: ['string', 'null'], format: date-time}
    BridgeEntityListed:
      type: object
      additionalProperties: false
      required: [entity_id, name, sense, kind]
      properties:
        entity_id: {type: string, pattern: '^[a-z0-9_]+\.[a-z0-9_]+$', maxLength: 200}
        name: {type: string, maxLength: 200}
        area: {type: string, maxLength: 120, description: The room in Home Assistant}
        device_class: {type: string, maxLength: 64}
        sense: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        kind: {type: string, enum: [number, state, event]}
        controls:
          type: array
          maxItems: 20
          description: What the box can do to it (ADR 0067); the API offers only what the device's type allows
          items: {$ref: '#/components/schemas/DeviceAction'}
    BridgeCameraFoundListed:
      type: object
      additionalProperties: false
      required: [id, onvif]
      properties:
        id: {type: string, minLength: 1, maxLength: 200, description: 'Its ONVIF endpoint (urn:uuid:…), or the Home Assistant entity for a camera without ONVIF'}
        address: {type: string, maxLength: 255, description: Its IP address on the home network}
        xaddr: {type: string, maxLength: 512, pattern: '^https?://', description: Its ONVIF device service}
        manufacturer: {type: string, maxLength: 120}
        model: {type: string, maxLength: 120}
        name: {type: string, maxLength: 120, description: The name in its ONVIF scopes}
        onvif: {type: boolean, description: Found with ONVIF; only these can be added from the list}
        home_assistant:
          type: object
          additionalProperties: false
          required: [entity_id, name]
          properties:
            entity_id: {type: string, pattern: '^camera\.[a-z0-9_]+$', maxLength: 200}
            name: {type: string, maxLength: 200}
            area: {type: string, maxLength: 120, description: The room in Home Assistant}
    BridgeCameraFound:
      type: object
      required: [id, onvif, seen_at]
      properties:
        id: {type: string}
        address: {type: [string, 'null']}
        manufacturer: {type: [string, 'null']}
        model: {type: [string, 'null']}
        name: {type: [string, 'null']}
        onvif: {type: boolean}
        home_assistant:
          type: [object, 'null']
          properties:
            entity_id: {type: string}
            name: {type: string}
            area: {type: [string, 'null']}
        source_id: {type: [string, 'null'], description: The box's camera at this address, once added}
        seen_at: {type: string, format: date-time}
    BridgeEntity:
      type: object
      required: [entity_id, name, sense, kind, chosen, listed]
      properties:
        entity_id: {type: string}
        name: {type: string}
        area: {type: [string, 'null']}
        device_class: {type: [string, 'null']}
        sense: {type: string}
        kind: {type: string, enum: [number, state, event]}
        chosen: {type: boolean, description: A person chose it; its readings are sent}
        source_id: {type: [string, 'null'], description: 'The sensor source of its room, once chosen'}
        listed: {type: boolean, description: False when Home Assistant no longer has it}
    Bridge:
      type: object
      required: [id, name, online, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: [string, 'null'], format: date-time}
        online: {type: boolean, description: Reported within the last three heartbeats}
        home_assistant:
          type: [object, 'null']
          properties:
            connected: {type: boolean}
            entities: {type: integer}
            sending: {type: integer}
        token: {type: string, description: 'Only when created with POST /bridges: the bridge token, shown once'}
        matter:
          type: [object, 'null']
          description: Its Matter controller (ADR 0062); null when it runs none
          properties:
            connected: {type: boolean}
            nodes: {type: integer}
        cameras_found: {type: [integer, 'null'], description: 'How many cameras it lists to pick from (ADR 0063); null when it doesn''t look'}
        mqtt_publish: {type: boolean, description: 'Whether it publishes Senseplane''s events to its MQTT broker for Home Assistant (ADR 0071); off by default'}
    BridgeOutputs:
      type: object
      required: [mqtt_publish, bridge_id, now, cursor, cameras, watches, events]
      properties:
        mqtt_publish: {type: boolean}
        bridge_id: {type: string, description: 'This box; it names what it publishes, so boxes can share a broker'}
        now: {type: string, format: date-time, description: The server's time}
        cursor: {type: string, description: 'Pass as `after` next time: a position in time (the newest event handed over, or now). The answer also repeats events from a few seconds before `after` (ids are minted before their event is stored); drop the ones already taken. It never reaches more than 10 minutes back.'}
        cameras:
          type: array
          items:
            type: object
            required: [id, name, online]
            properties:
              id: {type: string}
              name: {type: string}
              online: {type: boolean}
        watches:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string, description: The instruction, shortened}
        events:
          type: array
          items:
            type: object
            required: [id, type, source_id, occurred_at, age_ms, summary]
            properties:
              id: {type: string}
              type: {type: string, enum: [detection.person, detection.vehicle, detection.animal, watch.triggered, reading.threshold]}
              source_id: {type: string}
              watch_id: {type: string}
              occurred_at: {type: string, format: date-time}
              age_ms: {type: integer, description: How old the event is by the server's clock}
              summary: {type: string}
    ClipCreate:
      type: object
      required: [source, from, to]
      properties:
        source: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        title: {type: string, maxLength: 200}
    WatchCreate:
      type: object
      required: [instruction, sources]
      properties:
        instruction: {type: string, minLength: 3, maxLength: 500}
        sources: {type: array, minItems: 1, items: {type: string}, description: 'Source ids or names (case-insensitive). Several cameras are watched independently; events name the camera.'}
        duration_minutes: {type: integer, minimum: 1, maximum: 525600, description: 'Stop watching after this long (sets `expires_at`)'}
        notify: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Destination'}, description: 'Where watch.triggered goes (ADR 0043); absent or empty: every subscribed webhook. An agent key may list only itself.'}
        mode: {type: string, enum: [alert, track], default: alert, description: 'track: record activities only, to answer questions later, with no events or notifications (ADR 0057)'}
        compiled: {type: object, description: 'A compiled watch to use as it is instead of compiling the instruction (validated against the watch spec); packs and code that know exactly what they want'}
        active_hours:
          oneOf: [{type: 'null'}, {$ref: '#/components/schemas/WatchSchedule'}]
    WatchUpdate:
      type: object
      properties:
        instruction: {type: string}
        status: {type: string, enum: [active, paused]}
        mode: {type: string, enum: [alert, track]}
        compiled: {type: object}
        notify: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Destination'}, description: 'Replaces the destinations; [] goes back to every subscribed webhook.'}
        active_hours:
          oneOf: [{type: 'null'}, {$ref: '#/components/schemas/WatchSchedule'}]
          description: null removes the schedule.
    FeedbackRequest:
      type: object
      required: [feedback]
      properties:
        feedback: {type: string, enum: [relevant, not_relevant]}
    MemorySearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [event, score]
            properties:
              event: {$ref: '#/components/schemas/Event'}
              score: {type: number}
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: {type: string, format: uri}
        events: {type: array, minItems: 1, items: {type: string}, description: 'Event types to deliver: exact types (detection.person, detection.laptop), "*" for everything, or a prefix wildcard such as "detection.*"'}
    GrantCreate:
      type: object
      required: [agent_id, source_ids, senses]
      properties:
        agent_id: {type: string}
        source_ids: {type: array, minItems: 1, items: {type: string}}
        senses: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Sense'}}
        abilities: {type: array, items: {type: string, enum: [watch, history]}, description: 'Default both (ADR 0048)'}
        blurred_only: {type: boolean, description: 'Blurred snapshots, looks and answers only; no recordings, clips or live view (ADR 0068). Default false'}
        window:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
    AgentConnect:
      type: object
      required: [client_name, redirect_host, binding, source_ids, senses]
      additionalProperties: false
      properties:
        client_name: {type: string, minLength: 1, maxLength: 100, description: The name the MCP client registered with}
        redirect_host: {type: string, minLength: 1, maxLength: 255, description: Where the MCP service sends the authorization code}
        binding: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: From the MCP service's authorization request (base64url SHA-256 of its nonce)}
        source_ids: {type: array, minItems: 1, items: {type: string}}
        senses: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Sense'}}
        abilities: {type: array, items: {type: string, enum: [watch, history]}}
        blurred_only: {type: boolean, description: 'As on GrantCreate (ADR 0068). Default false'}
        window:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
    AuditEntry:
      type: object
      required: [id, actor, action, target, occurred_at]
      properties:
        id: {type: string}
        actor: {type: string, description: '`owner:<key prefix>` or `agent:<agent id>`'}
        status: {type: integer, description: HTTP status of the request}
        action: {type: string}
        target: {type: string}
        details: {type: object, description: 'What happened, for entries that say more: a device command has its device, action, value, who asked (`by`), through what (`via`), the outcome and `state_after`'}
        occurred_at: {type: string, format: date-time}
    DeviceAction:
      type: string
      enum: [turn_on, turn_off, set_brightness, open, close, set_position, set_temperature, set_mode, lock, unlock, arm_away, arm_home, disarm]
    DeviceState:
      type: object
      description: A device's state as its box read it back, or as its latest reading says; every field is optional.
      properties:
        available: {type: boolean}
        'on': {type: boolean}
        brightness: {type: number, minimum: 0, maximum: 100}
        open: {type: boolean}
        position: {type: number, minimum: 0, maximum: 100, description: Percent open}
        moving: {type: string, description: opening or closing}
        target_temperature: {type: number, description: °C}
        mode: {type: string}
        locked: {type: boolean}
        alarm: {type: string, description: 'disarmed, armed_away, armed_home, armed_night, triggered, arming, pending (or armed/disarmed from a reading)'}
        at: {type: string, format: date-time}
    Device:
      type: object
      required: [id, entity_id, name, room, bridge_id, source_id, type, tier, controllable, actions, state, online, can_control, warning]
      properties:
        id: {type: string}
        entity_id: {type: string, description: 'Home Assistant entity (light.hall) or Matter entity (matter.n4_e1_switch)'}
        name: {type: string}
        room: {type: [string, 'null']}
        bridge_id: {type: string}
        source_id: {type: string, description: The sensor source its state readings go to; a control grant on it lets an agent switch it}
        type: {type: string, enum: [light, switch, fan, siren, cover, garage_door, gate, climate, lock, alarm]}
        tier: {type: string, enum: [switch, secure], description: '`secure`: an agent''s request waits for a person, a person confirms their own'}
        controllable: {type: boolean, description: An admin made it controllable; off by default}
        actions: {type: array, items: {$ref: '#/components/schemas/DeviceAction'}}
        state: {oneOf: [{$ref: '#/components/schemas/DeviceState'}, {type: 'null'}]}
        online: {type: boolean, description: Its box is reporting and can reach Home Assistant or its Matter controller}
        can_control: {type: boolean, description: The caller may switch it now}
        warning: {type: string, description: What to tell a person before they make it controllable}
    DeviceCommand:
      type: object
      required: [id, device_id, device_name, entity_id, action, value, status, message, state, requested_by, via, expires_at, decided_by, created_at, finished_at]
      properties:
        id: {type: string}
        device_id: {type: string}
        device_name: {type: string}
        entity_id: {type: string}
        action: {$ref: '#/components/schemas/DeviceAction'}
        value: {type: [number, string, 'null']}
        status:
          type: string
          enum: [awaiting_confirmation, denied, expired, refused, sent, done, in_progress, unchanged, offline, failed]
          description: >-
            `done`: the state read back shows it; `in_progress`: it changed but hasn't got there yet (a door
            opening); `unchanged`: sent, but the state didn't change; `sent`: the box took it and hasn't
            reported yet; `offline`: the box didn't take it within 10 s and never will
        message: {type: string, description: 'What happened, in words: "Hall light is on."'}
        state: {oneOf: [{$ref: '#/components/schemas/DeviceState'}, {type: 'null'}], description: The state after}
        requested_by:
          type: object
          required: [kind, id, name]
          properties:
            kind: {type: string, enum: [user, account_key, agent]}
            id: {type: string}
            name: {type: [string, 'null']}
        via: {type: string, enum: [console, app, telegram, agent, api]}
        expires_at: {type: [string, 'null'], format: date-time, description: When a request waiting for a person is refused}
        decided_by: {type: [string, 'null'], description: The person who confirmed or refused it}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    ExportResponse:
      type: object
      required: [export_id, status]
      properties:
        export_id: {type: string}
        status: {type: string, enum: [pending, ready]}
        url: {type: string, format: uri, description: 'Signed link to the JSON export (media as signed links inside), valid 1 hour'}
        expires_at: {type: string, format: date-time}
    AgentCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    Agent:
      type: object
      required: [id, name, kind, last_active_at, created_at]
      properties:
        id: {type: string, pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'}
        name: {type: string}
        kind: {type: string, enum: [key, app, channel], description: '`key`: created with an API key for code; `app`: an MCP client connected on the consent page (ADR 0048); `channel`: a linked chat, such as Telegram, asking questions (ADR 0059)'}
        key_prefix: {type: string, description: Prefix of its newest live key}
        client_name: {type: string, description: Apps only}
        redirect_host: {type: string, description: 'Apps only: the redirect host, without port (loopback as `localhost`)'}
        connected_at: {type: string, format: date-time, description: 'Apps only: last approved'}
        last_active_at: {type: [string, 'null'], format: date-time, description: Its last API request}
        created_at: {type: string, format: date-time}
    # --- Live view (ADR 0042) -----------------------------------------------
    LiveViewRequest:
      type: object
      additionalProperties: false
      properties:
        audio: {type: boolean, description: "Also receive the source's audio (default false). Needs an audio grant and a source that records audio."}
        talk: {type: boolean, description: "Push-to-talk (ADR 0069): the token may also send the viewer's microphone to the camera's speaker, heard only by the camera. People only (member and up) and workspace keys; a phone camera on the capture page. 409 `no_speaker` otherwise."}
    LiveViewSession:
      type: object
      required: [session_id, media_url, token, expires_at, idle_timeout_seconds]
      properties:
        session_id: {type: string, description: 'Live session id (lv_...)'}
        media_url: {type: string, format: uri, description: WebSocket signalling URL (ws:// or wss://)}
        token: {type: string, description: Single-use media token for the signalling `join` frame}
        expires_at: {type: string, format: date-time, description: Join with the token before this time}
        idle_timeout_seconds: {type: integer, description: "The viewer is closed after this long without a keepalive (POST /live/{session_id}/keepalive)"}
        audio: {type: boolean, description: Whether this session includes audio}
        talk: {type: boolean, description: Whether this session may talk through the camera (push-to-talk)}
    SpeakRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500, description: 'What to say. Tell people they are hearing an automated system (docs/lawful-use.md).'}
    SpeakMessage:
      type: object
      required: [id, source_id, kind, status, created_at]
      properties:
        id: {type: string, description: 'spk_...'}
        source_id: {type: string}
        kind: {type: string, enum: [agent, watch, person], description: 'agent: the speak tool or REST; watch: a watch''s speak action; person: push-to-talk in live view'}
        text: {type: ['string', 'null'], description: What was said (agents and watches); null for push-to-talk}
        status: {type: string, enum: [queued, sent, playing, played, interrupted, refused, offline, late, failed], description: '`interrupted`: a person''s push-to-talk cut it off; `late`: the box got it too late and didn''t play it'}
        message: {type: ['string', 'null']}
        duration_ms: {type: ['integer', 'null'], description: Length of the clip with its chime, or how long the person talked}
        requested_by: {type: object, properties: {kind: {type: string}, id: {type: string}, name: {type: ['string', 'null']}}}
        watch_id: {type: ['string', 'null']}
        clip_url: {type: ['string', 'null'], description: Signed link to the clip as played (WAV), so a person can hear exactly what was said}
        created_at: {type: string, format: date-time}
        finished_at: {type: ['string', 'null'], format: date-time}
    # --- end live view ------------------------------------------------------
    AgentCreated:
      allOf:
        - {$ref: '#/components/schemas/Agent'}
        - type: object
          required: [api_key]
          properties:
            api_key: {type: string, description: 'Shown once. Use it as a Bearer token: REST API, SDK, or SENSEPLANE_API_KEY for the stdio MCP server.'}
    # --- team and workspace (ADR 0044) -----------------------------------------
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    User:
      type: object
      required: [id, email, name]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: [string, 'null']}
    Me:
      type: object
      required: [user, role, account, memberships]
      properties:
        user:
          oneOf:
            - {$ref: '#/components/schemas/User'}
            - {type: 'null'}
        role: {$ref: '#/components/schemas/Role'}
        account:
          type: object
          required: [id, name, time_zone]
          properties:
            id: {type: string}
            name: {type: string}
            time_zone: {type: string}
        memberships:
          type: array
          description: Every workspace the user belongs to (empty for API keys)
          items:
            type: object
            required: [account, role]
            properties:
              account:
                type: object
                required: [id, name]
                properties:
                  id: {type: string}
                  name: {type: string}
              role: {$ref: '#/components/schemas/Role'}
    MeUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: [string, 'null'], maxLength: 100}
    WorkspaceSwitch:
      type: object
      required: [account_id]
      additionalProperties: false
      properties:
        account_id: {type: string}
    ConsoleSession:
      type: object
      required: [session, expires_at, account_id]
      properties:
        session: {type: string, description: An expiring API key (sk_…) for console use}
        expires_at: {type: string, format: date-time}
        account_id: {type: string}
    Member:
      type: object
      required: [id, email, name, role, joined_at]
      properties:
        id: {type: string, description: User ID}
        email: {type: string, format: email}
        name: {type: [string, 'null']}
        role: {$ref: '#/components/schemas/Role'}
        joined_at: {type: string, format: date-time}
    MemberUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: {$ref: '#/components/schemas/Role'}
    InviteCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        role: {$ref: '#/components/schemas/Role'}
    Invite:
      type: object
      required: [id, email, role, status, invited_by, created_at, expires_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        status: {type: string, enum: [pending, expired, accepted, revoked]}
        invited_by: {type: string, description: "The inviter's email, or \"API key\""}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    InviteCreated:
      allOf:
        - {$ref: '#/components/schemas/Invite'}
        - type: object
          required: [invite_url]
          properties:
            invite_url: {type: string, format: uri, description: "Single-use link to the console (`<console>/#invite=<token>`). Shown once."}
    # --- Conversations (Ask; ADR 0041) -----------------------------------------
    Conversation: {$ref: './schemas/conversation.json'}
    Message: {$ref: './schemas/message.json'}
    Moment: {$ref: './schemas/moment.json'}
    Activity: {$ref: './schemas/activity.json'}
    ActivityQuery: {$ref: './schemas/activity-query.json'}
    ActivityAnswer: {$ref: './schemas/activity-answer.json'}
    ActivityCheckRequest:
      type: object
      additionalProperties: false
      properties:
        instruction: {type: string, minLength: 3, maxLength: 500, description: 'What to look for, as a watch is written'}
        watch_id: {type: string, description: 'Check an existing watch, and keep what is found as its activities'}
        sources: {type: array, minItems: 1, maxItems: 50, items: {type: string}}
        from: {type: string, format: date-time, description: 'Default 24 h before `to` (at most 7 days)'}
        to: {type: string, format: date-time, description: Default now}
        max_checks: {type: integer, minimum: 0, maximum: 50, description: 'Model checks to run at most (default 10)'}
    ActivityCheckResult:
      allOf:
        - {$ref: '#/components/schemas/WatchTestResult'}
        - type: object
          required: [stored]
          properties:
            stored: {type: integer, description: Matches kept as the watch's activities}
    WatchPack:
      type: object
      required: [id, name, description, watches]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        watches:
          type: array
          items:
            type: object
            required: [key, instruction, mode]
            properties:
              key: {type: string}
              instruction: {type: string}
              mode: {type: string, enum: [alert, track]}
              hours: {type: object, properties: {from: {type: string}, to: {type: string}}}
    WatchPackList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/WatchPack'}}
    WatchPackApply:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources: {type: array, minItems: 1, maxItems: 50, items: {type: string}, description: Source ids or names}
        items: {type: array, items: {type: string}, description: 'Only these watches of the pack, by key (default all)'}
        time_zone: {type: string, description: "IANA zone for the pack's times (default the workspace's)"}
        notify: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Destination'}}
    WatchPackApplied:
      type: object
      required: [pack, watches]
      properties:
        pack: {type: string}
        watches: {type: array, items: {$ref: '#/components/schemas/Watch'}}
    ActivityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Activity'}
    SuggestedWatch: {$ref: './schemas/suggested-watch.json'}
    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 2000}
        sources: {type: array, minItems: 1, maxItems: 50, items: {type: string}, description: 'Sources to consider; default every source the key can see'}
        from: {type: string, format: date-time, description: 'Only history from this time (default 7 days ago)'}
        to: {type: string, format: date-time, description: 'Only history before this time (default now)'}
        time_zone: {type: string, maxLength: 64, description: 'IANA time zone the answer should use for times (default UTC)'}
    ConversationStreamEvent:
      description: 'One Server-Sent Event: `event:` is the name below and `data:` its JSON.'
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event: {const: status}
            data: {type: object, required: [text], properties: {text: {type: string}}}
        - type: object
          required: [event, data]
          properties:
            event: {const: delta}
            data: {type: object, required: [text], properties: {text: {type: string}}}
        - type: object
          required: [event, data]
          properties:
            event: {const: moment}
            data: {$ref: '#/components/schemas/Moment'}
        - type: object
          required: [event, data]
          properties:
            event: {const: suggested_watch}
            data: {$ref: '#/components/schemas/SuggestedWatch'}
        - type: object
          required: [event, data]
          properties:
            event: {const: done}
            data: {type: object, required: [message], properties: {message: {$ref: '#/components/schemas/Message'}}}
        - type: object
          required: [event, data]
          properties:
            event: {const: error}
            data: {$ref: '#/components/schemas/Error'}
    # --- end Conversations -----------------------------------------------------
    # --- watch destinations (ADR 0043) -----------------------------------------
    Destination: {$ref: './schemas/destination.json'}
    WatchSchedule: {$ref: './schemas/watch-schedule.json'}
    WatchTestRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        instruction: {type: string, minLength: 3, maxLength: 500, description: Compiled first (like creating a watch)}
        compiled: {type: object, description: A compiled watch (Watch.compiled) to test as is}
        watch_id: {type: string, description: Test an existing watch (its compiled form, sources and schedule unless given)}
        sources: {type: array, minItems: 1, maxItems: 50, items: {type: string}, description: Source ids or names}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time, description: At most 7 days after from}
        active_hours:
          oneOf: [{type: 'null'}, {$ref: '#/components/schemas/WatchSchedule'}]
        max_checks: {type: integer, minimum: 0, maximum: 50, default: 10, description: Most model checks to run (each is an AI check)}
    WatchTestMatch:
      type: object
      required: [source_id, source_name, at, summary, verified]
      properties:
        source_id: {type: string}
        source_name: {type: string}
        at: {type: string, format: date-time}
        summary: {type: string}
        snapshot_url: {type: string, format: uri, description: Signed, 15-minute expiry; absent without a snapshot or a video grant}
        event_id: {type: string, description: The stored detection the match came from}
        ended_at: {type: string, format: date-time, description: When that detection's episode ended}
        verified: {type: [boolean, 'null'], description: 'true: the model check said yes; false: the watch has a check but no model ran; null: the watch has no check'}
        confidence: {type: [number, 'null']}
    WatchTestResult:
      type: object
      required: [matches, checks_used, candidates, unchecked, compiled]
      properties:
        matches: {type: array, items: {$ref: '#/components/schemas/WatchTestMatch'}}
        checks_used: {type: integer, description: Model checks run (metered as AI checks)}
        candidates: {type: integer, description: Times the cheap trigger fired in the range}
        unchecked: {type: integer, description: Candidates the model check did not reach (over max_checks, or no snapshot)}
        compiled: {type: object, description: The compiled watch that was tested}
    InboxItem:
      type: object
      required: [id, created_at, seen_at, event]
      properties:
        id: {type: string}
        watch_id: {type: string}
        created_at: {type: string, format: date-time}
        seen_at: {type: [string, 'null'], format: date-time}
        event: {$ref: '#/components/schemas/Event'}
    InboxSeenRequest:
      type: object
      additionalProperties: false
      properties:
        agent_id: {type: string, description: Required with an account key}
        ids: {type: array, maxItems: 500, items: {type: string}}
        all: {type: boolean, description: Mark every unseen item}
    # --- end watch destinations ---------------------------------------------------
